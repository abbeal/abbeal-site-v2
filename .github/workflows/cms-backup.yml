name: Daily CMS Backup

# Tous les jours a 03:00 UTC (= 04:00 Paris hiver / 05:00 Paris ete).
# Heure choisie pour low-traffic + minimum overlap avec deploys.
on:
  schedule:
    - cron: "0 3 * * *"
  # Workflow_dispatch : run manuel via GitHub Actions UI en cas de besoin
  workflow_dispatch:

permissions:
  contents: write # pour commit + push

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p backups
          echo "DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Fetch all collections from CMS API
        run: |
          # Collections content snapshot. Users SKIPPE car /api/users est
          # protege par access rule (admin only). Pour backup users, faut
          # creer un endpoint admin authentifie ou utiliser un API key
          # secret. Pour 3 users seulement, c'est OK de skip — recreation
          # manuelle en cas de perte. Le versioning Payload sur Users
          # (PR #17) couvre le risque d ecrasement.
          COLLECTIONS=(articles cases landing-pages glossary tech-radar team job-offers)
          FAILED=()

          for col in "${COLLECTIONS[@]}"; do
            echo "Fetching $col..."
            if ! curl -fsS --max-time 60 \
              "https://abbeal.com/api/$col?limit=1000&depth=0" \
              -o "backups/${col}-${DATE}.json"; then
              echo "::warning::HTTP error fetching $col — skipping"
              FAILED+=("$col")
              rm -f "backups/${col}-${DATE}.json"
              continue
            fi

            # Sanity check : JSON valide non-vide
            if ! python3 -m json.tool "backups/${col}-${DATE}.json" > /dev/null 2>&1; then
              echo "::warning::Invalid JSON for $col — skipping"
              FAILED+=("$col")
              rm -f "backups/${col}-${DATE}.json"
              continue
            fi

            count=$(python3 -c "import json; print(json.load(open('backups/${col}-${DATE}.json')).get('totalDocs', 0))")
            echo "  $col : $count docs backed up"
          done

          # On accepte des fails individuels (warning) mais on fail le job
          # si TOUTES les collections ont rate (probable outage prod).
          SUCCESS_COUNT=$((${#COLLECTIONS[@]} - ${#FAILED[@]}))
          echo "Summary: $SUCCESS_COUNT/${#COLLECTIONS[@]} collections backed up"
          if [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "::error::All collections failed — likely outage. Abort."
            exit 1
          fi

      - name: Generate manifest
        run: |
          # Manifest README dans le dossier backups pour rappel format
          cat > backups/README.md <<'EOF'
          # CMS Backups

          Snapshots quotidiens des collections Payload (via GitHub Actions cron 03:00 UTC).

          Format : `{collection}-YYYY-MM-DD.json`. Chaque fichier est la response
          brute de `/api/{collection}?limit=1000&depth=0` avec :
          - `docs[]` : array des documents
          - `totalDocs` : count
          - `limit`, `page`, etc.

          ## Restauration manuelle

          Si une row disparait accidentellement, on peut :
          1. Trouver la version dans le backup le plus recent
          2. La re-POSTer via API admin (`curl -X POST /api/{collection} -H "Authorization: users API-Key <key>"`)
          3. Ou re-creer manuellement via /admin

          ## Politique de retention

          GitHub garde tout l historique git -> backups sont retroactivement
          accessibles via `git log -p backups/`.

          Pour nettoyer les vieux fichiers (>90 jours), un job manuel suffit
          (pas auto pour eviter perte accidentelle).
          EOF

      - name: Commit + push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi
          git commit -m "chore(backup): CMS snapshot ${DATE}

          Auto-generated by .github/workflows/cms-backup.yml
          Collections: users, articles, cases, landing-pages, glossary,
                       tech-radar, team, job-offers
          "
          git push
